<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 스터디 도우미 · StudyBoard</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand"><span class="dot">●</span> StudyBoard</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="app-shell">
  <aside class="app-rail" id="appRail"></aside>
  <div class="app-content">
  <div class="container" style="max-width:820px;">
    <div class="dash-header"><h1>🛰️ AI 스터디 도우미</h1><p>공부하다 막히면 무엇이든 물어보세요.</p></div>

    <div class="alert" id="alert"></div>

    <div class="quick-chips" id="quickChips">
      <span class="quick-chip" data-q="정보처리기사 실기 공부 순서를 알려줘">📘 정처기 공부 순서</span>
      <span class="quick-chip" data-q="토익 800점 목표로 4주 공부 계획 세워줘">🎯 토익 4주 계획</span>
      <span class="quick-chip" data-q="집중이 안 될 때 효과적인 공부법 추천해줘">🧠 집중 공부법</span>
    </div>

    <div class="card chat-wrap">
      <div class="chat-log" id="chatLog">
        <div class="msg ai">안녕하세요! 저는 StudyBoard의 AI 스터디 도우미예요. 공부 관련 질문, 학습 계획, 개념 설명까지 도와드릴게요. 무엇을 도와드릴까요?</div>
      </div>
      <form class="chat-input" id="chatForm">
        <textarea id="chatInput" placeholder="메시지를 입력하세요 (Shift+Enter 줄바꿈)" required></textarea>
        <button type="submit" class="btn btn-primary" id="sendBtn" style="align-self:flex-end;">전송</button>
      </form>
    </div>
    <p class="muted mt-8" style="font-size:12px;">※ AI 응답은 참고용이에요. 중요한 내용은 꼭 검토하세요.</p>
  </div>
  </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    if (!Auth.require()) { throw new Error('redirect'); }
    renderNav();
    renderRail('ai');

    const log     = document.getElementById('chatLog');
    const input   = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const alertEl = document.getElementById('alert');
    const history = [];   // {role, content}

    function bubble(role, text, cls = '') {
      const div = document.createElement('div');
      div.className = `msg ${role === 'user' ? 'user' : 'ai'} ${cls}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    async function send(text) {
      text = text.trim();
      if (!text) return;
      hideAlert(alertEl);
      bubble('user', text);
      history.push({ role: 'user', content: text });
      input.value = '';
      autoGrow();

      const pending = bubble('ai', '생각하는 중...', 'thinking');
      setLoading(sendBtn, true);
      try {
        const d = await api('/api/ai/chat', { method: 'POST', body: { messages: history } });
        pending.classList.remove('thinking');
        pending.textContent = d.reply;
        history.push({ role: 'assistant', content: d.reply });
      } catch (err) {
        pending.remove();
        history.pop();
        showAlert(alertEl, err.message);
      } finally {
        setLoading(sendBtn, false, '전송');
        log.scrollTop = log.scrollHeight;
      }
    }

    document.getElementById('chatForm').onsubmit = (e) => { e.preventDefault(); send(input.value); };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
    });
    function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; }
    input.addEventListener('input', autoGrow);

    document.getElementById('quickChips').onclick = (e) => {
      const chip = e.target.closest('.quick-chip');
      if (chip) send(chip.dataset.q);
    };

    // OCR 등에서 ?q= 로 들어오면 자동 질문
    const preset = queryParam('q');
    if (preset) send(preset);
  </script>
</body>
</html>
