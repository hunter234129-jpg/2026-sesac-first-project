<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 스터디 도우미 · StudyBoard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* ── AI 챗 전용: 뷰포트에 꽉 차는 밀도형 레이아웃 (페이지 스크롤 없음, 로그만 스크롤) ── */
    .ai-page {
      height: calc(100vh - 56px); min-height: 480px;
      display: flex; flex-direction: column; gap: 12px;
      max-width: 980px; margin: 0 auto; padding: 16px 22px 18px;
    }

    /* 헤더 — 타이틀/서브 위계를 크게 벌린다 */
    .ai-head { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .ai-head .ah-icon {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 20px;
      background: linear-gradient(135deg, rgba(0,229,255,.16), rgba(168,85,247,.14));
      border: 1px solid rgba(0,229,255,.25);
      box-shadow: 0 0 18px rgba(0,229,255,.12), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .ai-head h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: #f0f4ff; line-height: 1.2; }
    .ai-head .ah-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
    .ai-head .ah-tag {
      margin-left: auto; font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
      color: var(--cyan); opacity: .55; border: 1px solid rgba(0,229,255,.2); border-radius: 99px; padding: 3px 10px;
      white-space: nowrap;
    }

    /* 챗 카드 — 배경과 분리된 얇은 유리 레이어 */
    .ai-card {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
      overflow: hidden;
    }

    /* 로그 */
    .ai-log { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 10px; }
    .ai-log .msg { max-width: 76%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.7; box-shadow: none; }
    .ai-log .msg.user { border-bottom-right-radius: 4px; }
    .ai-log .msg.ai { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-bottom-left-radius: 4px; backdrop-filter: none; }
    .ai-log .msg.ai.thinking { color: var(--faint); }

    /* 시작 화면 — 인사 + 2x2 추천 카드 (첫 질문과 함께 사라짐) */
    .ai-welcome { margin: auto 0; padding: 8px 6px 4px; text-align: center; }
    .ai-welcome .aw-orb {
      width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%;
      display: grid; place-items: center; font-size: 25px;
      background: radial-gradient(circle at 35% 30%, rgba(0,229,255,.25), rgba(168,85,247,.15) 70%);
      border: 1px solid rgba(0,229,255,.3); box-shadow: 0 0 26px rgba(0,229,255,.18);
    }
    .ai-welcome .aw-title { font-size: 16px; font-weight: 700; color: #e8edf8; }
    .ai-welcome .aw-sub { font-size: 12.5px; color: var(--muted); margin: 4px 0 16px; }
    .ai-suggest-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      max-width: 560px; margin: 0 auto; text-align: left;
    }
    .quick-chip {
      display: flex; flex-direction: column; gap: 3px;
      padding: 11px 14px; border-radius: 12px; cursor: pointer;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .quick-chip:hover { border-color: rgba(0,229,255,.4); background: rgba(0,229,255,.05); box-shadow: 0 0 14px rgba(0,229,255,.1); }
    .quick-chip .qc-t { font-size: 13px; font-weight: 600; color: var(--text); }
    .quick-chip .qc-d { font-size: 11px; color: var(--faint); }
    @media (max-width: 560px) { .ai-suggest-grid { grid-template-columns: 1fr; } }

    /* 입력 바 — 카드 하단 고정, 포커스 시 사이언 글로우 */
    .ai-inputwrap { flex-shrink: 0; padding: 10px 12px 12px; border-top: 1px solid rgba(255,255,255,.06); }
    .ai-inputwrap .alert { margin-bottom: 8px; padding: 9px 12px; font-size: 13px; }
    .ai-form {
      display: flex; align-items: flex-end; gap: 8px;
      background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.09); border-radius: 14px;
      padding: 8px 8px 8px 14px; transition: border-color .15s, box-shadow .2s;
    }
    .ai-form:focus-within { border-color: rgba(0,217,192,.45); box-shadow: 0 0 15px rgba(0,217,192,.2); }
    .ai-form textarea {
      flex: 1; resize: none; min-height: 24px; max-height: 140px;
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14px; line-height: 1.6; font-family: var(--font);
      padding: 4px 0;
    }
    .ai-form textarea::placeholder { color: var(--faint); }
    .ai-form .ai-send {
      flex-shrink: 0; height: 34px; padding: 0 16px; border: none; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 700; font-family: var(--font); color: #04121a;
      background: linear-gradient(135deg, #4deeff, var(--cyan));
      box-shadow: 0 0 14px rgba(0,229,255,.25); transition: filter .15s, box-shadow .15s;
    }
    .ai-send:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 0 20px rgba(0,229,255,.4); }
    .ai-send:disabled { opacity: .55; cursor: default; }
    .ai-foot { flex-shrink: 0; text-align: center; font-size: 11px; color: var(--faint); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard" class="brand"><span class="dot">●</span> StudyBoard</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="app-shell">
  <aside class="app-rail" id="appRail"></aside>
  <div class="app-content">
    <div class="ai-page">
      <div class="ai-head">
        <div class="ah-icon">🛰️</div>
        <div>
          <h1>AI 스터디 도우미</h1>
          <div class="ah-sub">공부하다 막히면 무엇이든 물어보세요 · 응답은 참고용이에요</div>
        </div>
        <span class="ah-tag">GEMINI</span>
      </div>

      <div class="ai-card">
        <div class="ai-log" id="chatLog">
          <!-- 시작 화면: 첫 질문을 보내면 사라진다 -->
          <div class="ai-welcome" id="welcomeBlock">
            <div class="aw-orb">🛰️</div>
            <div class="aw-title">무엇을 도와드릴까요?</div>
            <div class="aw-sub">학습 계획, 개념 설명, 공부법까지 — 아래에서 골라 바로 시작해보세요.</div>
            <div class="ai-suggest-grid" id="quickChips">
              <div class="quick-chip" data-q="정보처리기사 실기 공부 순서를 알려줘">
                <span class="qc-t">📘 정처기 공부 순서</span>
                <span class="qc-d">실기 과목별 학습 로드맵</span>
              </div>
              <div class="quick-chip" data-q="토익 800점 목표로 4주 공부 계획 세워줘">
                <span class="qc-t">🎯 토익 4주 계획</span>
                <span class="qc-d">목표 점수 맞춤 스케줄</span>
              </div>
              <div class="quick-chip" data-q="집중이 안 될 때 효과적인 공부법 추천해줘">
                <span class="qc-t">🧠 집중 공부법</span>
                <span class="qc-d">몰입을 되찾는 실전 팁</span>
              </div>
              <div class="quick-chip" data-q="오늘 공부한 내용을 오래 기억하는 복습 방법 알려줘">
                <span class="qc-t">🔁 복습 루틴</span>
                <span class="qc-d">장기 기억으로 남기는 법</span>
              </div>
            </div>
          </div>
        </div>

        <div class="ai-inputwrap">
          <div class="alert" id="alert"></div>
          <form class="ai-form" id="chatForm">
            <textarea id="chatInput" rows="1" placeholder="메시지를 입력하세요 (Shift+Enter 줄바꿈)" required></textarea>
            <button type="submit" class="ai-send" id="sendBtn">전송 ➤</button>
          </form>
        </div>
      </div>

      <div class="ai-foot">교재 사진이 있다면 <a href="/ocr">OCR로 스캔</a>해서 바로 질문할 수 있어요</div>
    </div>
  </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    if (!Auth.require()) { throw new Error('redirect'); }
    renderNav();
    renderRail('ai');

    const log     = document.getElementById('chatLog');
    const input   = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const alertEl = document.getElementById('alert');
    const history = [];   // {role, content}

    function bubble(role, text, cls = '') {
      const div = document.createElement('div');
      div.className = `msg ${role === 'user' ? 'user' : 'ai'} ${cls}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    async function send(text) {
      text = text.trim();
      if (!text) return;
      hideAlert(alertEl);
      document.getElementById('welcomeBlock')?.remove();   // 시작 화면 제거
      bubble('user', text);
      history.push({ role: 'user', content: text });
      input.value = '';
      autoGrow();

      const pending = bubble('ai', '생각하는 중...', 'thinking');
      setLoading(sendBtn, true);
      try {
        const d = await api('/api/ai/chat', { method: 'POST', body: { messages: history } });
        pending.classList.remove('thinking');
        pending.textContent = d.reply;
        history.push({ role: 'assistant', content: d.reply });
      } catch (err) {
        pending.remove();
        history.pop();
        showAlert(alertEl, err.message);
      } finally {
        setLoading(sendBtn, false, '전송 ➤');
        log.scrollTop = log.scrollHeight;
      }
    }

    document.getElementById('chatForm').onsubmit = (e) => { e.preventDefault(); send(input.value); };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
    });
    function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(140, input.scrollHeight) + 'px'; }
    input.addEventListener('input', autoGrow);

    document.getElementById('quickChips').onclick = (e) => {
      const chip = e.target.closest('.quick-chip');
      if (chip) send(chip.dataset.q);
    };

    // OCR 등에서 ?q= 로 들어오면 자동 질문
    const preset = queryParam('q');
    if (preset) send(preset);
  </script>
</body>
</html>
