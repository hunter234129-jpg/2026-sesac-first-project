<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클랜 · 스터디 플랫폼</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard" class="brand"><span class="dot">●</span> StudyBoard</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="app-shell">
  <aside class="app-rail" id="appRail"></aside>
  <div class="app-content">
  <div class="container">
    <div class="dash-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;">
      <div>
        <h1>클랜</h1>
        <p>함께 공부할 스터디 그룹 · 기여도 랭킹</p>
      </div>
      <button class="btn btn-primary" id="newClanBtn">＋ 클랜 만들기</button>
    </div>

    <div class="alert" id="alert"></div>

    <!-- 생성 폼 (토글) -->
    <form class="card hidden" id="createForm" style="margin-bottom:20px;">
      <div class="field">
        <label for="clanName">클랜 이름 *</label>
        <input type="text" id="clanName" placeholder="예: 정처기 6월 합격조" maxlength="100" required>
      </div>
      <div class="field">
        <label for="clanDesc">소개</label>
        <textarea id="clanDesc" rows="3" placeholder="클랜 소개 (선택)" style="resize:vertical;"></textarea>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary" id="createBtn">만들기</button>
        <button type="button" class="btn btn-ghost" id="cancelCreate">취소</button>
      </div>
    </form>

    <!-- 클랜전 (이번 주) -->
    <div class="card section" id="battleCard" style="margin-bottom:20px;">
      <div class="section-head"><h2>🔥 이번 주 클랜전</h2><span class="muted" style="font-size:12px;">멤버 합산 공부시간 · 목표 달성률</span></div>
      <div id="battleList"><p class="muted" style="font-size:14px;">불러오는 중...</p></div>
    </div>

    <!-- 전체 클랜 기여도 랭킹 테이블 -->
    <div class="card section" style="padding:14px 12px;">
      <div class="section-head" style="padding:0 4px;"><h2>🛡️ 전체 클랜 기여도 랭킹</h2><span class="muted" style="font-size:12px;">기여도 순 · 클릭해서 상세보기</span></div>
      <div class="crt-head"><span style="text-align:center;">순위</span><span>클랜</span><span style="text-align:center;">멤버</span><span>기여도</span><span style="text-align:right;">클랜장</span></div>
      <div id="clanGrid">
        <p class="muted" style="padding:24px 12px;">불러오는 중...</p>
      </div>
    </div>
  </div>
  </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    renderNav();
    renderRail('clans');
    const alertEl = document.getElementById('alert');

    function fmtMin(m) {
      m = +m || 0;
      const h = Math.floor(m / 60), mm = m % 60;
      if (h && mm) return `${h}시간 ${mm}분`;
      if (h)       return `${h}시간`;
      return `${mm}분`;
    }

    /* ── 클랜전 랭킹 — 상단 1위 vs 2위 VS 위젯 + 전체 순위 바 ── */
    async function loadBattle() {
      const el = document.getElementById('battleList');
      try {
        const d = await api('/api/clans/ranking', { auth: false });
        const rows = d.ranking || [];
        if (!rows.length) {
          el.innerHTML = '<p class="muted" style="font-size:14px;">아직 클랜이 없어요.</p>';
          return;
        }
        const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };

        // 1위 vs 2위 히어로 (2개 이상일 때만)
        let vsHtml = '';
        if (rows.length >= 2) {
          const [a, b] = rows;
          const pa = Math.round((a.progress || 0) * 100);
          const pb = Math.round((b.progress || 0) * 100);
          vsHtml = `
            <div class="battle-vs">
              <a class="bv-side a" href="/clan?id=${a.id}">
                <div class="bv-rank">🥇 1위 · ${a.member_count}명</div>
                <div class="bv-name">${escapeHtml(a.name)}</div>
                <div class="bv-min">${fmtMin(a.week_min)}</div>
                <div class="bv-prog"><i style="width:${pa}%"></i></div>
                <div class="bv-rank" style="margin-top:5px;">목표 달성 ${pa}%</div>
              </a>
              <div class="bv-mid">VS</div>
              <a class="bv-side b" href="/clan?id=${b.id}">
                <div class="bv-rank">🥈 2위 · ${b.member_count}명</div>
                <div class="bv-name">${escapeHtml(b.name)}</div>
                <div class="bv-min">${fmtMin(b.week_min)}</div>
                <div class="bv-prog"><i style="width:${pb}%"></i></div>
                <div class="bv-rank" style="margin-top:5px;">목표 달성 ${pb}%</div>
              </a>
            </div>`;
        }

        el.innerHTML = vsHtml + rows.map(r => {
          const pct = Math.round((r.progress || 0) * 100);
          return `<a class="battle-row" href="/clan?id=${r.id}">
            <div class="battle-rank">${medals[r.rank] || ('#' + r.rank)}</div>
            <div class="battle-main">
              <div class="battle-name">${escapeHtml(r.name)} <span class="muted" style="font-size:12px;">· ${r.member_count}명</span></div>
              <div class="prog"><i style="width:${pct}%"></i></div>
            </div>
            <div class="battle-val">${fmtMin(r.week_min)}<div class="muted" style="font-size:11px; font-weight:400;">목표 ${fmtMin(r.goal_min)} · ${pct}%</div></div>
          </a>`;
        }).join('');
      } catch (err) {
        el.innerHTML = `<p class="muted" style="font-size:14px;">${escapeHtml(err.message)}</p>`;
      }
    }
    loadBattle();

    /* ── 생성 폼 토글 ── */
    const createForm = document.getElementById('createForm');
    document.getElementById('newClanBtn').onclick = () => {
      if (!Auth.isLoggedIn) { location.href = '/login?next=/clans'; return; }
      createForm.classList.toggle('hidden');
      if (!createForm.classList.contains('hidden')) document.getElementById('clanName').focus();
    };
    document.getElementById('cancelCreate').onclick = () => createForm.classList.add('hidden');

    createForm.onsubmit = async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const btn = document.getElementById('createBtn');
      setLoading(btn, true);
      try {
        const d = await api('/api/clans', { method: 'POST', body: {
          name: document.getElementById('clanName').value.trim(),
          description: document.getElementById('clanDesc').value.trim(),
        }});
        location.href = '/clan?id=' + d.id;
      } catch (err) {
        showAlert(alertEl, err.message);
        setLoading(btn, false, '만들기');
      }
    };

    /* ── 목록 — 메달 + 네온 기여도 바 테이블 ── */
    const medals = { 0: '🥇', 1: '🥈', 2: '🥉' };
    async function load() {
      const grid = document.getElementById('clanGrid');
      try {
        const clans = await api('/api/clans', { auth: false });
        if (!clans.length) {
          grid.innerHTML = '<p class="muted" style="padding:24px 12px;">아직 클랜이 없어요. 첫 클랜을 만들어보세요!</p>';
          return;
        }
        const maxScore = Math.max(1, ...clans.map(c => +c.total_score || 0));
        grid.innerHTML = clans.map((c, i) => {
          const barPct = Math.round((+c.total_score || 0) / maxScore * 100);
          return `
          <a class="crt-row" href="/clan?id=${c.id}">
            <span class="crt-rank ${i < 3 ? 'medal' : ''}">${medals[i] || (i + 1)}</span>
            <span class="crt-name">
              <span>${escapeHtml(c.name)}</span>
              <span class="crt-desc">${escapeHtml(c.description || '소개가 없어요.')}</span>
            </span>
            <span class="crt-members">${c.member_count}명</span>
            <span class="crt-score">
              <span class="prog"><i style="width:${barPct}%"></i></span>
              <span class="crt-num">${c.total_score}점</span>
            </span>
            <span class="crt-leader">👑 ${escapeHtml(c.leader)}</span>
          </a>`;
        }).join('');
      } catch (err) {
        grid.innerHTML = `<p class="muted" style="padding:24px 12px;">${escapeHtml(err.message)}</p>`;
      }
    }
    load();
  </script>
</body>
</html>
