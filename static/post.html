<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 · 스터디 플랫폼</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .dday-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .dday-chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
      border-radius: 99px; font-size: 12px; background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.2); color: var(--muted, #9aa4c2);
    }
    .dday-chip b { color: var(--text, #e8edf8); font-family: monospace; }
    .dday-chip.soon { background: rgba(255,68,102,0.1); border-color: rgba(255,68,102,0.3); }
    .dday-chip.soon b { color: #FF4466; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard" class="brand"><span class="dot">●</span> StudyBoard</a>
    <span class="breadcrumb" id="breadcrumb"></span>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="app-shell">
  <aside class="app-rail" id="appRail"></aside>
  <div class="app-content">
  <div class="container" style="max-width:760px;">
    <a href="/board" class="muted" style="font-size:14px;">← 목록으로</a>
    <div class="alert mt-16" id="alert"></div>

    <div class="post-detail card mt-16" id="postCard">
      <p class="muted text-center" style="padding:40px 0;">불러오는 중...</p>
    </div>

    <div class="card section hidden" id="requestsCard" style="margin-top:20px;">
      <div class="section-head"><h2>가입 신청 <span id="requestCount" class="muted"></span></h2></div>
      <div class="rank-list" id="requestList"></div>
    </div>

    <div class="card section hidden" id="membersCard" style="margin-top:20px;">
      <div class="section-head"><h2>멤버 <span id="memberCount" class="muted"></span></h2></div>
      <div class="rank-list" id="memberList"></div>
    </div>

    <!-- 모임 채팅 — 카카오톡 오픈채팅 방식, 가입한 멤버만 접근·영구 보존 -->
    <div class="card section clan-chat-card hidden" id="chatCard" style="margin-top:20px;">
      <div class="section-head"><h2>💬 모임 채팅</h2><span class="live-dot" id="chatLiveDot" title="실시간 연결됨" style="display:none;">●</span></div>
      <div class="clan-chat-log" id="chatLog">
        <button type="button" class="btn btn-ghost clan-chat-more hidden" id="loadMoreBtn">이전 메시지 더보기</button>
      </div>
      <form class="clan-chat-form" id="chatForm">
        <button type="button" class="cf-file-btn" id="chatFileBtn" title="파일 첨부">＋</button>
        <input type="file" id="chatFileInput" hidden>
        <input type="text" id="chatTextInput" placeholder="메시지를 입력하세요" maxlength="1000" autocomplete="off">
        <button type="submit" class="btn btn-primary">전송</button>
      </form>
      <p class="muted clan-chat-readonly hidden" id="chatReadonlyNote" style="font-size:12px; text-align:center; margin-top:8px;">
        탈퇴한 모임이라 새 메시지는 보낼 수 없어요. 지난 대화만 볼 수 있어요.
      </p>
    </div>

    <div class="comments-section" id="commentsSection" style="display:none;">
      <h3>댓글 <span id="commentCount">0</span></h3>
      <div id="commentList"></div>

      <form class="comment-form" id="commentForm">
        <textarea id="commentInput" placeholder="댓글을 입력하세요" required></textarea>
        <div><button type="submit" class="btn btn-primary" style="padding:8px 20px;">댓글 등록</button></div>
      </form>
      <p class="muted mt-8" id="loginToComment" style="display:none; font-size:14px;">
        댓글을 작성하려면 <a href="/login">로그인</a>하세요.
      </p>
    </div>
  </div>
  </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    renderNav();
    renderRail('board');
    const postId  = queryParam('id');
    const alertEl = document.getElementById('alert');
    if (!postId) { showAlert(alertEl, '잘못된 접근입니다.'); }

    const myId = Auth.userId;

    /* ── 날짜 포맷: "2026-07-06(월)" ── */
    function fmtDate(str) {
      if (!str) return '미정';
      let d;
      if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
        const [y, m, day] = str.split('T')[0].split('-').map(Number);
        d = new Date(y, m - 1, day);
      } else {
        d = new Date(str);
      }
      if (isNaN(d)) return str;
      const yy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const dow = ['일','월','화','수','목','금','토'][d.getDay()];
      return `${yy}-${mm}-${dd}(${dow})`;
    }

    /* ── 시험 D-day ── */
    function ddayLabel(dateStr) {
      if (!dateStr) return null;
      const target = new Date(dateStr);
      if (isNaN(target)) return null;
      const today = new Date();
      const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const d0 = new Date(target.getFullYear(), target.getMonth(), target.getDate());
      const diff = Math.round((d0 - t0) / 86400000);
      if (diff === 0) return { text: 'D-DAY', soon: true };
      if (diff > 0)   return { text: `D-${diff}`, soon: diff <= 7 };
      return { text: `D+${-diff}`, soon: false };
    }
    function examDdayHtml(info) {
      if (!info) return '';
      const items = [
        ['원서접수 시작', info.apply_start],
        ['원서접수 마감', info.apply_end],
        ['시험일',       info.exam_start],
        ['합격자 발표',   info.result_date],
      ].map(([label, d]) => {
        const dd = ddayLabel(d);
        return dd ? `<span class="dday-chip${dd.soon ? ' soon' : ''}">${label} <b>${dd.text}</b></span>` : '';
      }).filter(Boolean).join('');
      return items ? `<div class="dday-row">${items}</div>` : '';
    }

    /* ── 게시글 상세 ── */
    async function loadPost() {
      const card = document.getElementById('postCard');
      try {
        const p = await api('/api/posts/' + postId, { auth: false });
        renderBreadcrumb([{ label: '게시판', href: '/board' }, { label: p.title }]);
        const isOwner = Auth.isLoggedIn && p.user_id === myId;
        const isStudy = p.type === 'study';

        // 실질적 마감 여부 (status, 마감일, 정원 초과 모두 고려)
        const isEffectivelyClosed = isStudy && (() => {
          if (p.status === 'closed') return true;
          if (p.recruit_count > 0 && (p.member_count || 0) >= p.recruit_count) return true;
          if (p.recruit_deadline) {
            const str = p.recruit_deadline;
            let dl;
            if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
              const [y, m, d] = str.split('T')[0].split('-').map(Number);
              dl = new Date(y, m - 1, d);
            } else { dl = new Date(str); }
            if (!isNaN(dl)) {
              const today = new Date(); today.setHours(0, 0, 0, 0);
              if (dl < today) return true;
            }
          }
          return false;
        })();

        const typeBadge = isStudy
          ? '<span class="tbadge study">스터디</span>'
          : '<span class="tbadge post">게시글</span>';
        const statusBadge = isStudy
          ? (isEffectivelyClosed ? '<span class="tbadge closed">모집 마감</span>' : '<span class="tbadge open">모집중</span>')
          : '';

        let recruitHtml = '';
        if (isStudy) {
          recruitHtml = `
            <div class="pd-recruit">
              <div><div class="label">모집 인원</div>${p.recruit_count || 0}명 (현재 <span id="currentMemberCount">${p.member_count || 0}</span>명)</div>
              ${p.study_start ? `<div><div class="label">스터디 시작일</div>${fmtDate(p.study_start)}</div>` : ''}
              ${p.study_end   ? `<div><div class="label">스터디 종료일</div>${fmtDate(p.study_end)}</div>` : ''}
              <div><div class="label">가입 방식</div>${p.join_mode === 'approval' ? '모임장 승인 필요' : '바로 참가'}</div>
              ${p.linked_exam_name ? `<div><div class="label">연동 시험</div>🗓️ ${escapeHtml(p.linked_exam_name)}</div>` : ''}
              <div><div class="label">분야</div>${escapeHtml(p.field || '미지정')}</div>
            </div>
            ${examDdayHtml(p.exam_info)}`;
        }

        let membership = { status: 'none' };
        if (isStudy && !isOwner && Auth.isLoggedIn) {
          try { membership = await api(`/api/posts/${postId}/membership`); } catch (_) {}
        }

        let ownerActions = '';
        if (isOwner) {
          ownerActions = `
            <div class="pd-actions">
              ${isStudy ? (() => {
                const toggleDisabled = isEffectivelyClosed && p.status === 'open';
                const label = p.status === 'open' ? '모집 마감' : '다시 모집';
                const disabledStyle = toggleDisabled ? 'opacity:.35;cursor:not-allowed;pointer-events:none;' : '';
                return `<button class="btn btn-ghost" id="toggleStatusBtn" style="padding:7px 14px;${disabledStyle}" ${toggleDisabled ? 'disabled' : ''}>${label}</button>`;
              })() : ''}
              <a class="btn btn-ghost" href="/write?id=${p.id}" style="padding:7px 14px;">수정</a>
              <button class="btn btn-danger" id="deleteBtn" style="padding:7px 14px;">삭제</button>
            </div>`;
        } else if (isStudy) {
          if (!Auth.isLoggedIn) {
            ownerActions = `<div class="pd-actions"><a class="btn btn-primary" href="/login?next=${encodeURIComponent('/post?id='+postId)}" style="padding:7px 14px;">로그인 후 참가</a></div>`;
          } else if (membership.status === 'active') {
            ownerActions = `<div class="pd-actions"><button class="btn btn-ghost" id="leaveBtn" style="padding:7px 14px;">탈퇴하기</button></div>`;
          } else if (membership.status === 'pending') {
            ownerActions = `
              <div class="pd-actions">
                <span class="tbadge" style="background:rgba(245,158,11,.15); color:#F59E0B;">⏳ 승인 대기중</span>
                <button class="btn btn-ghost" id="cancelReqBtn" style="padding:7px 14px;">신청 취소</button>
              </div>`;
          } else {
            const label = p.join_mode === 'approval' ? '참가 신청하기' : '참가하기';
            ownerActions = `<div class="pd-actions"><button class="btn btn-primary" id="joinBtn" style="padding:7px 14px;">${label}</button></div>`;
          }
        }

        card.innerHTML = `
          <div class="pd-title">${typeBadge} ${statusBadge} ${escapeHtml(p.title)}</div>
          <div class="pd-meta">
            <span>✍️ ${escapeHtml(p.author)}</span>
            <span>👁 조회 ${p.view_count}</span>
            ${p.category ? `<span>🏷️ ${escapeHtml(p.category)}</span>` : ''}
            ${isStudy && p.recruit_deadline
              ? `<span>🕒 마감 ${fmtDate(p.recruit_deadline)}</span>`
              : `<span>🕒 ${fmtDate(p.created_at)}</span>`}
            ${ownerActions}
          </div>
          ${recruitHtml}
          <div class="pd-content">${escapeHtml(p.content || '(내용 없음)')}</div>`;

        // 삭제
        const delBtn = document.getElementById('deleteBtn');
        if (delBtn) delBtn.onclick = async () => {
          if (!confirm('정말 삭제하시겠어요?')) return;
          try { await api('/api/posts/' + postId, { method: 'DELETE' }); location.href = '/board'; }
          catch (err) { showAlert(alertEl, err.message); }
        };
        // 모집 상태 토글
        const tBtn = document.getElementById('toggleStatusBtn');
        if (tBtn) tBtn.onclick = async () => {
          const next = p.status === 'open' ? 'closed' : 'open';
          try { await api(`/api/posts/${postId}/status`, { method: 'PATCH', body: { status: next } }); loadPost(); }
          catch (err) { showAlert(alertEl, err.message); }
        };
        // 모임 참가 신청/즉시 가입
        const joinBtn = document.getElementById('joinBtn');
        if (joinBtn) joinBtn.onclick = async () => {
          const label = joinBtn.textContent;
          setLoading(joinBtn, true);
          try { await api(`/api/posts/${postId}/join`, { method: 'POST' }); loadPost(); }
          catch (err) { showAlert(alertEl, err.message); setLoading(joinBtn, false, label); }
        };
        // 탈퇴
        const leaveBtn = document.getElementById('leaveBtn');
        if (leaveBtn) leaveBtn.onclick = async () => {
          if (!confirm('모임에서 탈퇴할까요?')) return;
          try { await api(`/api/posts/${postId}/leave`, { method: 'DELETE' }); loadPost(); }
          catch (err) { showAlert(alertEl, err.message); }
        };
        // 가입 신청 취소
        const cancelReqBtn = document.getElementById('cancelReqBtn');
        if (cancelReqBtn) cancelReqBtn.onclick = async () => {
          try { await api(`/api/posts/${postId}/leave`, { method: 'DELETE' }); loadPost(); }
          catch (err) { showAlert(alertEl, err.message); }
        };

        if (isStudy) {
          loadMembers(p.user_id, isOwner && p.join_mode === 'approval');
          document.getElementById('requestsCard').classList.add('hidden');
          if (Auth.isLoggedIn) initChat();
        }
      } catch (err) {
        card.innerHTML = `<p class="muted text-center" style="padding:40px 0;">${escapeHtml(err.message)}</p>`;
      }
    }

    /* ── 멤버 목록(스터디 모임) ── */
    async function loadMembers(ownerId, showRequests) {
      try {
        const [members, requests] = await Promise.all([
          api(`/api/posts/${postId}/members`, { auth: false }),
          showRequests ? api(`/api/posts/${postId}/requests`).catch(() => []) : Promise.resolve([]),
        ]);

        document.getElementById('membersCard').classList.remove('hidden');
        document.getElementById('memberCount').textContent = `${members.length}명`;
        const curEl = document.getElementById('currentMemberCount');
        if (curEl) curEl.textContent = members.length;

        const el = document.getElementById('memberList');

        const memberRows = members.map((m, i) => {
          const isLeader = m.id === ownerId;
          const isMe = m.id === myId;
          return `
            <div class="rank-row ${isMe ? 'me' : ''}">
              <div class="rank-num">${i + 1}</div>
              <div class="rank-name">
                ${isLeader ? '👑 ' : ''}${escapeHtml(m.username)}${isMe ? ' <span style="font-size:11px;color:var(--muted,#9aa4c2);">(본인)</span>' : ''}
              </div>
              <div class="rank-time">${m.contribution_score}점</div>
            </div>`;
        }).join('');

        const requestRows = requests.map(r => `
          <div class="rank-row" data-uid="${r.id}" style="opacity:.8;">
            <div class="rank-num" style="font-size:14px;">⏳</div>
            <div class="rank-name" style="color:var(--muted,#9aa4c2);">
              ${escapeHtml(r.username)}
              <span style="font-size:11px; margin-left:4px;">(승인 대기)</span>
            </div>
            <div style="display:flex; gap:6px; margin-left:auto;">
              <button class="btn btn-primary" data-act="accept" style="padding:4px 12px; font-size:12px;">승인</button>
              <button class="btn btn-ghost"   data-act="reject" style="padding:4px 12px; font-size:12px;">취소</button>
            </div>
          </div>`).join('');

        el.innerHTML = memberRows + (requests.length
          ? `<div style="border-top:1px solid rgba(255,255,255,.06); margin-top:6px; padding-top:6px;">${requestRows}</div>`
          : '');

        el.querySelectorAll('[data-act]').forEach(btn => {
          btn.onclick = async () => {
            const uid = btn.closest('[data-uid]').dataset.uid;
            btn.disabled = true;
            try {
              if (btn.dataset.act === 'accept') {
                await api(`/api/posts/${postId}/requests/${uid}/accept`, { method: 'POST' });
              } else {
                await api(`/api/posts/${postId}/requests/${uid}`, { method: 'DELETE' });
              }
              loadPost();
            } catch (err) { showAlert(alertEl, err.message); btn.disabled = false; }
          };
        });
      } catch (_) {}
    }

    /* ── 가입 신청 관리(모임장 전용, join_mode='approval'일 때만) ── */
    async function loadRequests() {
      const card = document.getElementById('requestsCard');
      try {
        const reqs = await api(`/api/posts/${postId}/requests`);
        if (!reqs.length) { card.classList.add('hidden'); return; }
        card.classList.remove('hidden');
        document.getElementById('requestCount').textContent = `${reqs.length}건`;
        const el = document.getElementById('requestList');
        el.innerHTML = reqs.map(r => `
          <div class="rank-row" data-uid="${r.id}">
            <div class="rank-name">${escapeHtml(r.username)}</div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-primary" data-act="accept" style="padding:5px 12px;">수락</button>
              <button class="btn btn-ghost" data-act="reject" style="padding:5px 12px;">거절</button>
            </div>
          </div>`).join('');
        el.querySelectorAll('[data-act]').forEach(btn => {
          btn.onclick = async () => {
            const uid = btn.closest('[data-uid]').dataset.uid;
            btn.disabled = true;
            try {
              if (btn.dataset.act === 'accept') {
                await api(`/api/posts/${postId}/requests/${uid}/accept`, { method: 'POST' });
              } else {
                await api(`/api/posts/${postId}/requests/${uid}`, { method: 'DELETE' });
              }
              loadPost();
            } catch (err) { showAlert(alertEl, err.message); btn.disabled = false; }
          };
        });
      } catch (_) { card.classList.add('hidden'); }
    }

    /* ── 댓글 ── */
    function commentHtml(c) {
      const mine = Auth.isLoggedIn && c.user_id === myId;
      const replies = (c.replies || []).map(commentHtml).join('');
      return `
        <div class="comment" data-cid="${c.id}">
          <div class="comment-meta">
            <span class="cm-author">${escapeHtml(c.username)}</span>
            <span class="cm-date">${(c.created_at||'').replace('T',' ').slice(0,16)}</span>
          </div>
          <div class="comment-body" data-body>${escapeHtml(c.content)}</div>
          <div class="comment-actions">
            ${Auth.isLoggedIn ? `<button data-act="reply">답글</button>` : ''}
            ${mine ? `<button data-act="edit">수정</button><button data-act="delete">삭제</button>` : ''}
          </div>
          <div data-reply-slot></div>
          ${replies ? `<div class="comment-replies">${replies}</div>` : ''}
        </div>`;
    }

    async function loadComments() {
      const listEl = document.getElementById('commentList');
      try {
        const tree = await api(`/api/posts/${postId}/comments`, { auth: false });
        const count = countComments(tree);
        document.getElementById('commentCount').textContent = count;
        listEl.innerHTML = tree.length ? tree.map(commentHtml).join('')
          : '<p class="muted" style="font-size:14px; padding:8px 0;">첫 댓글을 남겨보세요.</p>';
        wireComments(listEl);
      } catch (err) {
        listEl.innerHTML = `<p class="muted">${escapeHtml(err.message)}</p>`;
      }
    }
    function countComments(nodes) {
      return nodes.reduce((n, c) => n + 1 + countComments(c.replies || []), 0);
    }

    function wireComments(root) {
      root.querySelectorAll('.comment').forEach(el => {
        const cid = el.dataset.cid;
        el.querySelectorAll(':scope > .comment-actions button').forEach(btn => {
          btn.onclick = () => handleCommentAction(btn.dataset.act, el, cid);
        });
      });
    }

    function handleCommentAction(act, el, cid) {
      const slot = el.querySelector(':scope > [data-reply-slot]');
      const body = el.querySelector(':scope > .comment-body');

      if (act === 'reply') {
        if (slot.querySelector('form')) { slot.innerHTML = ''; return; }
        slot.innerHTML = `
          <form class="comment-form reply-form">
            <textarea placeholder="답글을 입력하세요" required></textarea>
            <div><button type="submit" class="btn btn-ghost" style="padding:6px 16px;">답글 등록</button></div>
          </form>`;
        slot.querySelector('form').onsubmit = async (e) => {
          e.preventDefault();
          const content = slot.querySelector('textarea').value.trim();
          if (!content) return;
          try {
            await api(`/api/posts/${postId}/comments`, { method:'POST', body: { content, parent_id: +cid } });
            loadComments();
          } catch (err) { showAlert(alertEl, err.message); }
        };
      }

      if (act === 'edit') {
        const original = body.textContent;
        if (body.querySelector('textarea')) return;
        body.innerHTML = `
          <form class="comment-form" style="margin-top:0;">
            <textarea required>${escapeHtml(original)}</textarea>
            <div style="display:flex; gap:6px;">
              <button type="submit" class="btn btn-primary" style="padding:5px 14px;">저장</button>
              <button type="button" class="btn btn-ghost" data-cancel style="padding:5px 14px;">취소</button>
            </div>
          </form>`;
        body.querySelector('[data-cancel]').onclick = () => loadComments();
        body.querySelector('form').onsubmit = async (e) => {
          e.preventDefault();
          const content = body.querySelector('textarea').value.trim();
          if (!content) return;
          try {
            await api(`/api/posts/${postId}/comments/${cid}`, { method:'PUT', body: { content } });
            loadComments();
          } catch (err) { showAlert(alertEl, err.message); }
        };
      }

      if (act === 'delete') {
        if (!confirm('댓글을 삭제할까요? (답글도 함께 삭제됩니다)')) return;
        api(`/api/posts/${postId}/comments/${cid}`, { method:'DELETE' })
          .then(loadComments)
          .catch(err => showAlert(alertEl, err.message));
      }
    }

    // 댓글 작성 폼
    document.getElementById('commentsSection').style.display = 'block';
    if (Auth.isLoggedIn) {
      document.getElementById('commentForm').onsubmit = async (e) => {
        e.preventDefault();
        const ta = document.getElementById('commentInput');
        const content = ta.value.trim();
        if (!content) return;
        try {
          await api(`/api/posts/${postId}/comments`, { method:'POST', body: { content } });
          ta.value = '';
          loadComments();
        } catch (err) { showAlert(alertEl, err.message); }
      };
    } else {
      document.getElementById('commentForm').style.display = 'none';
      document.getElementById('loginToComment').style.display = 'block';
    }

    /* ══════════ 모임 채팅 — 카카오톡 오픈채팅 방식 ══════════
       가입 절차 자체가 이미 입장 승인이라 신청/수락 핸드셰이크가 없다.
       탈퇴해도 대화 기록은 지워지지 않고(영구 보존), 본인이 나간 시점까지만 계속 보인다. */
    const AVATARS = [
      { emoji: '🦊', bg: '#FF6B6B' }, { emoji: '🐱', bg: '#FFA94D' }, { emoji: '🐶', bg: '#FFD43B' },
      { emoji: '🐼', bg: '#94D82D' }, { emoji: '🐨', bg: '#37B24D' }, { emoji: '🦁', bg: '#20C997' },
      { emoji: '🐯', bg: '#22B8CF' }, { emoji: '🐵', bg: '#4DABF7' }, { emoji: '🐰', bg: '#5C7CFA' },
      { emoji: '🐺', bg: '#845EF7' }, { emoji: '🐸', bg: '#CC5DE8' }, { emoji: '🐧', bg: '#F783AC' },
      { emoji: '🦉', bg: '#FF8787' }, { emoji: '🐙', bg: '#FFC078' }, { emoji: '🦋', bg: '#FFE066' },
      { emoji: '🐹', bg: '#B2F2BB' }, { emoji: '🐭', bg: '#99E9F2' }, { emoji: '🐔', bg: '#91A7FF' },
      { emoji: '🐮', bg: '#D0BFFF' }, { emoji: '🐷', bg: '#FCC2D7' },
    ];
    function avatarChip(avatarId, size) {
      const a = AVATARS[avatarId] || AVATARS[0];
      return `<span class="avatar-chip" style="background:${a.bg}; width:${size}px; height:${size}px; font-size:${Math.round(size * 0.58)}px;">${a.emoji}</span>`;
    }

    let chatSocket = null;
    let oldestMsgId = null;
    let chatIsActiveMember = false;

    function chatBubbleHtml(m) {
      if (m.msg_type === 'system') {
        return `<div class="clan-chat-sys" data-id="${m.id}">${escapeHtml(m.content)}</div>`;
      }
      const mine = m.sender_id === myId;
      let body;
      if (m.msg_type === 'file') {
        const isImage = (m.mime_type || '').startsWith('image/');
        body = isImage
          ? `<a href="${m.file_url}" target="_blank" rel="noopener noreferrer"><img class="cf-file-img" src="${m.file_url}" alt="${escapeHtml(m.file_name)}"></a>`
          : `<a href="${m.file_url}" target="_blank" rel="noopener noreferrer" class="cf-file-link">📎 ${escapeHtml(m.file_name)}</a>`;
      } else {
        body = escapeHtml(m.content);
      }
      return `
        <div class="clan-chat-row ${mine ? 'mine' : ''}" data-id="${m.id}">
          ${!mine ? avatarChip(m.avatar_id, 26) : ''}
          <div class="ccr-bubble-wrap">
            ${!mine ? `<div class="ccr-name">${escapeHtml(m.username)}</div>` : ''}
            <div class="ccr-bubble ${m.msg_type === 'file' ? 'file' : ''}">${body}</div>
          </div>
        </div>`;
    }

    function appendMessages(msgs, prepend) {
      if (!msgs.length) return;
      const log = document.getElementById('chatLog');
      const moreBtn = document.getElementById('loadMoreBtn');
      const html = msgs.map(chatBubbleHtml).join('');
      if (prepend) {
        const beforeHeight = log.scrollHeight;
        moreBtn.insertAdjacentHTML('afterend', html);
        log.scrollTop = log.scrollHeight - beforeHeight;
        oldestMsgId = msgs[0].id;
      } else {
        log.insertAdjacentHTML('beforeend', html);
        log.scrollTop = log.scrollHeight;
        if (oldestMsgId === null) oldestMsgId = msgs[0].id;
      }
    }

    async function loadChatHistory(before) {
      const qs = before ? `?before=${before}&size=30` : '?size=30';
      const d = await api(`/api/posts/${postId}/chat${qs}`);
      chatIsActiveMember = d.is_active_member;
      document.getElementById('loadMoreBtn').classList.toggle('hidden', !d.has_more);
      appendMessages(d.messages, !!before);
      document.getElementById('chatForm').style.display = chatIsActiveMember ? 'flex' : 'none';
      document.getElementById('chatReadonlyNote').classList.toggle('hidden', chatIsActiveMember);
    }

    function connectChatSocket() {
      if (chatSocket || !chatIsActiveMember) return;
      chatSocket = io({ auth: { token: Auth.token } });
      const liveDot = document.getElementById('chatLiveDot');
      chatSocket.on('connect', () => {
        liveDot.style.display = 'inline';
        chatSocket.emit('join_post_chat', { post_id: Number(postId) });
      });
      chatSocket.on('disconnect', () => { liveDot.style.display = 'none'; });
      chatSocket.on('post_message', (m) => {
        if (m.post_id !== Number(postId)) return;
        appendMessages([m], false);
      });
      chatSocket.on('chat_blocked', (d) => {
        if (d.post_id !== Number(postId)) return;
        appendMessages([{ id: 'blocked-' + Date.now(), msg_type: 'system', content: d.message }], false);
      });
      chatSocket.on('post_kicked', (d) => {
        if (d.post_id !== Number(postId)) return;
        chatSocket.emit('leave_post_chat', { post_id: Number(postId) });
        chatIsActiveMember = false;
        document.getElementById('chatForm').style.display = 'none';
        document.getElementById('chatReadonlyNote').classList.remove('hidden');
      });
    }

    async function initChat() {
      // join/leave/가입승인 등으로 loadPost()가 다시 불릴 때마다 initChat도 다시 불리는데,
      // 이미 초기화돼 있으면 또 불러오지 않는다 — 안 그러면 history가 매번 중복으로 쌓인다.
      if (chatSocket) return;
      try {
        await loadChatHistory();
      } catch (err) {
        if (err.code === 'NOT_MEMBER') return;   // 가입 안 한 사람에겐 그냥 숨김(정상 상태)
        showAlert(alertEl, err.message);
        return;
      }
      document.getElementById('chatCard').classList.remove('hidden');
      connectChatSocket();
    }

    document.getElementById('loadMoreBtn').onclick = () => loadChatHistory(oldestMsgId);

    document.getElementById('chatForm').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('chatTextInput');
      const text = input.value.trim();
      if (!text || !chatSocket) return;
      chatSocket.emit('post_message', { post_id: Number(postId), message: text });
      input.value = '';
    };

    const chatFileBtn   = document.getElementById('chatFileBtn');
    const chatFileInput = document.getElementById('chatFileInput');
    chatFileBtn.onclick = () => chatFileInput.click();
    chatFileInput.onchange = async () => {
      const file = chatFileInput.files[0];
      chatFileInput.value = '';
      if (!file || !chatSocket) return;
      chatFileBtn.disabled = true;
      try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('ref_type', 'post_chat');
        const uploaded = await api('/api/upload', { method: 'POST', body: fd, isForm: true });
        chatSocket.emit('post_file', {
          post_id: Number(postId), file_url: uploaded.url, file_name: uploaded.original,
          mime_type: file.type, file_size: file.size,
        });
      } catch (err) {
        showAlert(alertEl, err.message || '파일 업로드에 실패했어요.');
      } finally {
        chatFileBtn.disabled = false;
      }
    };

    if (postId) { loadPost(); loadComments(); }
  </script>
</body>
</html>
