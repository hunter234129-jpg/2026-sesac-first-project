<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 · 스터디 플랫폼</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand"><span class="dot">●</span> StudyBoard</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="center-screen">
    <form class="card auth-card" id="registerForm">
      <h2>회원가입</h2>
      <p class="sub">함께 공부할 준비됐나요?</p>

      <div class="alert" id="alert"></div>

      <div class="field">
        <label for="email">이메일 *</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">비밀번호 *</label>
        <input type="password" id="password" placeholder="비밀번호" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="username">닉네임 *</label>
        <input type="text" id="username" placeholder="공개적으로 표시될 이름" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="real_name">실명</label>
        <input type="text" id="real_name" placeholder="실명 (선택)">
      </div>
      <div class="field">
        <label for="interest_keywords">관심 키워드</label>
        <input type="text" id="interest_keywords" placeholder="예: 정보처리기사, 토익, 파이썬">
        <p class="hint">쉼표(,)로 구분해 입력하세요. 관련 게시글 알림을 받을 수 있어요.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">가입하기</button>

      <p class="switch">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
    </form>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    renderNav();
    if (Auth.isLoggedIn) location.href = '/dashboard';

    const form  = document.getElementById('registerForm');
    const alert = document.getElementById('alert');
    const btn   = document.getElementById('submitBtn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      hideAlert(alert);
      setLoading(btn, true);
      try {
        await api('/api/auth/register', {
          method: 'POST', auth: false,
          body: {
            email:             document.getElementById('email').value.trim(),
            password:          document.getElementById('password').value,
            username:          document.getElementById('username').value.trim(),
            real_name:         document.getElementById('real_name').value.trim(),
            interest_keywords: document.getElementById('interest_keywords').value.trim(),
          }
        });
        // 가입 후 자동 로그인
        const data = await api('/api/auth/login', {
          method: 'POST', auth: false,
          body: {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }
        });
        Auth.save(data.access_token, data.username);
        location.href = '/dashboard';
      } catch (err) {
        showAlert(alert, err.message);
        setLoading(btn, false, '가입하기');
      }
    };
  </script>
</body>
</html>
