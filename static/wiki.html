<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위키 · 스터디 플랫폼</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard" class="brand"><span class="dot">●</span> StudyBoard</a>
    <span class="breadcrumb" id="breadcrumb"></span>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="app-shell">
  <aside class="app-rail" id="appRail"></aside>
  <div class="app-content">
  <div class="container" style="max-width:820px;">
    <div class="alert" id="alert"></div>

    <!-- ════ 홈 뷰 ════ -->
    <div id="homeView" style="display:none;">
      <div class="dash-header" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div><h1>위키</h1><p>함께 만들어가는 학습 자료</p></div>
        <button type="button" class="btn btn-primary" id="newWikiBtn" style="padding:9px 18px; white-space:nowrap;">➕ 새 위키 만들기</button>
      </div>

      <div class="wiki-search">
        <input type="search" id="searchInput" placeholder="주제 검색... (없으면 새로 만들 수 있어요)">
        <button class="btn btn-primary" id="searchBtn">검색</button>
      </div>

      <div id="searchResult"></div>

      <div class="wiki-home-grid">
        <div class="card section">
          <div class="section-head">
            <h2>조회수 랭킹</h2>
            <div class="seg" id="periodSeg">
              <button data-p="today" class="active">오늘</button>
              <button data-p="week">주간</button>
            </div>
          </div>
          <div id="rankList"><p class="muted" style="font-size:14px;">불러오는 중...</p></div>
        </div>

        <div class="card section">
          <div class="section-head"><h2>최근 생성</h2></div>
          <div id="recentList"><p class="muted" style="font-size:14px;">불러오는 중...</p></div>
        </div>
      </div>
    </div>

    <!-- ════ 상세 뷰 — 노션 스타일 풀폭 문서 (카드 박스 없음) ════ -->
    <div id="detailView" style="display:none;">
      <div class="wiki-doc" id="docCard">
        <p class="muted text-center" style="padding:40px 0;">불러오는 중...</p>
      </div>
      <!-- 이력 영역 -->
      <div class="card section mt-16" id="historyCard" style="display:none;">
        <div class="section-head"><h2>수정 이력</h2></div>
        <div id="historyList"><p class="muted" style="font-size:14px;">불러오는 중...</p></div>
      </div>
      <!-- 하단 중앙 상태바: 단어·글자·읽기시간·저장상태 -->
      <div class="wiki-statusbar hidden" id="wikiStatusbar">
        <span id="wsWords">단어 0</span>
        <span class="ws-sep"></span>
        <span id="wsChars">글자 0</span>
        <span class="ws-sep"></span>
        <span id="wsRead">읽기 약 1분</span>
        <span class="ws-sep"></span>
        <span class="ws-save" id="wsSave">연결 중...</span>
      </div>
    </div>
  </div>
  </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/js/excalidraw-modal.js"></script>
  <script type="module" src="/static/js/wiki-editor.js"></script>
  <script type="module">
    // module 스크립트끼리는 문서 순서대로 실행이 보장되므로(타이머 폴링과 달리
    // 백그라운드 탭 스로틀링의 영향을 받지 않음), wiki-editor.js 다음에 이 스크립트가
    // 오는 것만으로 window.WikiEditor가 이미 준비돼 있음이 보장된다.
    renderNav();
    renderRail('wiki');

    function fmtDate(str) {
      if (!str) return '';
      let d;
      if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
        const [y, m, day] = str.split('T')[0].split('-').map(Number);
        d = new Date(y, m - 1, day);
      } else {
        d = new Date(str);
      }
      if (isNaN(d)) return str;
      const KO_DOW = ['일','월','화','수','목','금','토'];
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}(${KO_DOW[d.getDay()]})`;
    }

    const alertEl = document.getElementById('alert');
    const slug    = queryParam('slug');

    /* ══════════ 홈 뷰 ══════════ */
    function initHome() {
      // 랭킹/최근 2열 그리드가 들어갈 만큼 홈도 조금 넓게
      document.querySelector('.container').style.maxWidth = '1000px';
      document.getElementById('homeView').style.display = 'block';

      // 새 위키 만들기(검색 없이 바로) — 검색해서 "이 주제로 만들기"가 뜨기 전에도 늘 보이는 진입점
      document.getElementById('newWikiBtn').onclick = () => openCreate();

      // 검색
      const searchInput = document.getElementById('searchInput');
      async function doSearch() {
        const q = searchInput.value.trim();
        const box = document.getElementById('searchResult');
        if (!q) { box.innerHTML = ''; return; }
        try {
          const d = await api('/api/wiki/search?q=' + encodeURIComponent(q), { auth: false });
          const results = d.results || [];
          let html = '<div class="card section">';
          if (results.length) {
            html += results.map(w => `
              <div class="wiki-rank-row">
                <a class="wr-title" href="/wiki?slug=${encodeURIComponent(w.slug)}">${escapeHtml(w.title)}</a>
                <span class="wr-views">조회 ${w.view_count}</span>
              </div>`).join('');
          } else {
            html += '<p class="muted" style="font-size:14px;">검색 결과가 없어요.</p>';
          }
          if (d.can_create) {
            html += `<div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
              <span class="muted" style="font-size:14px;">'<b style="color:var(--text)">${escapeHtml(q)}</b>' 주제가 없어요.</span>
              <button class="btn btn-success" id="createFromSearch" style="padding:8px 16px;">이 주제로 만들기</button>
            </div>`;
          }
          html += '</div>';
          box.innerHTML = html;
          const cfs = document.getElementById('createFromSearch');
          if (cfs) cfs.onclick = () => openCreate(q);
        } catch (err) { showAlert(alertEl, err.message); }
      }
      document.getElementById('searchBtn').onclick = doSearch;
      searchInput.onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };

      // 랭킹
      async function loadRanking(period) {
        const el = document.getElementById('rankList');
        try {
          const d = await api('/api/wiki?period=' + period + '&limit=10', { auth: false });
          const items = d.ranking || [];
          el.innerHTML = items.length ? items.map((w, i) => `
            <div class="wiki-rank-row">
              <span class="wr-num">${i + 1}</span>
              <a class="wr-title" href="/wiki?slug=${encodeURIComponent(w.slug)}">${escapeHtml(w.title)}</a>
              <span class="wr-views">전체 ${w.view_count} · ${period==='today'?'오늘':'주간'} ${w.period_views}</span>
            </div>`).join('')
            : '<p class="muted" style="font-size:14px;">아직 위키가 없어요.</p>';
        } catch (err) { el.innerHTML = `<p class="muted" style="font-size:14px;">${escapeHtml(err.message)}</p>`; }
      }
      document.getElementById('periodSeg').onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        document.querySelectorAll('#periodSeg button').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); loadRanking(b.dataset.p);
      };
      loadRanking('today');

      // 최근
      (async () => {
        const el = document.getElementById('recentList');
        try {
          const d = await api('/api/wiki?period=today', { auth: false });
          const items = d.recent || [];
          el.innerHTML = items.length ? items.map(w => `
            <div class="wiki-recent-row">
              <a class="wr-title" href="/wiki?slug=${encodeURIComponent(w.slug)}" style="flex:1;">${escapeHtml(w.title)}</a>
              <span class="wr-views" style="color:var(--muted); font-size:13px;">${fmtDate(w.created_at)}</span>
            </div>`).join('')
            : '<p class="muted" style="font-size:14px;">아직 위키가 없어요.</p>';
        } catch (_) {}
      })();
    }

    // 제목만 받고 여기서 바로 생성하지 않는다 — 실제 생성은 초안 편집화면에서
    // "저장"을 눌러야 일어난다(그 전까지는 DB에 아무 것도 남지 않는다).
    function openCreate(prefillTitle) {
      if (!Auth.isLoggedIn) { location.href = '/login?next=/wiki'; return; }
      const title = prompt('새 위키 제목', prefillTitle || '');
      if (title === null) return;
      const t = title.trim();
      if (!t) return;
      location.href = '/wiki?new=' + encodeURIComponent(t);
    }

    /* ══════════ 상세 뷰 ══════════ */
    let curDoc = null;
    function initDetail() {
      // 문서 화면은 홈(820px)보다 넓게 — 노션처럼 화면 폭을 활용한다
      document.querySelector('.container').style.maxWidth = '1200px';
      document.getElementById('detailView').style.display = 'block';
      loadDoc();
    }

    async function loadDoc() {
      const card = document.getElementById('docCard');
      document.getElementById('historyCard').style.display = 'none';
      if (window.WikiEditor) await WikiEditor.destroy();
      try {
        const w = await api('/api/wiki/' + encodeURIComponent(slug), { auth: false });
        curDoc = w;
        renderBreadcrumb([{ label: '위키 홈', href: '/wiki' }, { label: w.title }]);
        const canEdit = Auth.isLoggedIn;
        const isAdmin = Auth.isAdmin;
        card.innerHTML = `
          <div class="wd-hero-row">
            <h1 class="wd-hero-title">${escapeHtml(w.title)}</h1>
            <div class="wd-actions">
              ${canEdit ? `<button class="btn btn-primary" id="saveBtn" style="padding:7px 16px;">💾 저장</button>` : ''}
              <button class="btn btn-ghost" id="historyBtn" style="padding:7px 14px;">🕘 이력</button>
              ${isAdmin ? `<button class="btn btn-danger" id="delBtn" style="padding:7px 14px;">삭제</button>` : ''}
            </div>
          </div>
          <div class="wd-meta-row">
            <span class="version-badge" id="versionBadge">v${w.version}</span>
            <span class="wm-sep">|</span>
            <span>최초: ${escapeHtml(w.created_by)}</span>
            <span class="wm-sep">|</span>
            <span>최종: ${escapeHtml(w.last_editor)}</span>
            <span class="wm-sep">|</span>
            <span>조회 ${w.view_count}</span>
            <span class="wm-sep">|</span>
            <span>${(w.last_updated||'').replace('T',' ').slice(0,16)}</span>
            ${canEdit ? '<span class="wm-sep">|</span><span class="wm-save" id="syncStatus"></span>' : ''}
          </div>
          <div id="editorMount" class="tiptap-mount"></div>`;

        document.getElementById('historyBtn').onclick = toggleHistory;
        const db = document.getElementById('delBtn');
        if (db) db.onclick = async () => {
          if (!confirm('이 위키를 삭제할까요? (되돌릴 수 없어요)')) return;
          try { await api('/api/wiki/' + encodeURIComponent(slug), { method: 'DELETE' }); location.href = '/wiki'; }
          catch (err) { showAlert(alertEl, err.message); }
        };

        // 보기/편집 구분 없이 항상 같은 실시간 세션을 연다 — 로그인 사용자는 바로 입력 가능
        // (서식/삽입 도구모음은 wiki-editor.js가 입력 영역 위에 직접 붙인다),
        // 아닌 사람은 읽기 전용으로 보되 남의 변경이 새로고침 없이 그대로 반영된다.
        // 자동저장은 없다 — "저장" 버튼을 눌러야만 실제로 반영되고, 안 누르고 나가면
        // 그동안의 변경은 저장되지 않은 채로 사라진다(다른 접속자에게는 실시간으로만 보였을 뿐).
        await WikiEditor.mount({
          container: document.getElementById('editorMount'),
          slug, initialContent: w.content, username: Auth.username, editable: canEdit, title: w.title,
        });
        setSaveState(canEdit ? '저장된 상태' : '읽기 전용');

        const saveBtn = document.getElementById('saveBtn');
        if (saveBtn) saveBtn.onclick = async () => {
          setLoading(saveBtn, true);
          try {
            const result = await WikiEditor.save(slug);
            const vb = document.getElementById('versionBadge');
            if (vb && result) vb.textContent = 'v' + result.version;
            setSaveState('저장됨 · ' + new Date().toLocaleTimeString());
          } catch (err) {
            showAlert(alertEl, '저장에 실패했어요: ' + err.message);
          } finally {
            setLoading(saveBtn, false, '💾 저장');
          }
        };

        startStatusbar(canEdit);
      } catch (err) {
        card.innerHTML = `<p class="muted text-center" style="padding:40px 0;">${escapeHtml(err.message)}</p>`;
      }
    }

    /* ══════════ 초안(아직 생성 안 된) 뷰 ══════════
       "저장"을 처음 누르는 순간에만 실제로 POST /api/wiki가 나간다 — 그 전까지는
       제목만 정해진 상태로 로컬에서만 편집 중인 것이고 DB에는 아무 것도 없다. */
    async function initDraft(title) {
      document.querySelector('.container').style.maxWidth = '1200px';
      document.getElementById('detailView').style.display = 'block';
      renderBreadcrumb([{ label: '위키 홈', href: '/wiki' }, { label: title }]);

      const card = document.getElementById('docCard');
      card.innerHTML = `
        <div class="wd-hero-row">
          <h1 class="wd-hero-title">${escapeHtml(title)}</h1>
          <div class="wd-actions">
            <button class="btn btn-primary" id="saveBtn" disabled style="padding:7px 16px;">💾 저장</button>
          </div>
        </div>
        <div class="wd-meta-row">
          <span class="muted" id="syncStatus">아직 저장되지 않았어요 — 저장을 눌러야 위키가 만들어져요</span>
        </div>
        <div id="editorMount" class="tiptap-mount"></div>`;

      // 아직 존재하지 않는 문서라 slug가 없다 — 임시 room 이름으로만 마운트하고
      // (다른 사람이 join할 슬러그가 없으므로 실질적으로 혼자만 쓰는 세션),
      // 처음 저장할 때 실제 slug가 발급되면 그 문서 화면으로 이동한다.
      await WikiEditor.mount({
        container: document.getElementById('editorMount'),
        slug: null, initialContent: '', username: Auth.username, editable: true, title,
      });
      startStatusbar(true);

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = false;
      saveBtn.onclick = async () => {
        setLoading(saveBtn, true);
        try {
          const editor = WikiEditor.getEditor();
          const d = await api('/api/wiki', {
            method: 'POST',
            body: { title, content: JSON.stringify(editor.getJSON()), summary: '최초 생성' },
          });
          WikiEditor.markClean();
          location.href = '/wiki?slug=' + encodeURIComponent(d.slug);
        } catch (err) {
          showAlert(alertEl, '저장에 실패했어요: ' + err.message);
          setLoading(saveBtn, false, '💾 저장');
        }
      };
    }

    /* ── 하단 상태바: 단어/글자/읽기시간(2초 주기) + 저장 상태 ── */
    let wsTimer = null;
    function startStatusbar(canEdit) {
      document.getElementById('wikiStatusbar').classList.remove('hidden');
      document.getElementById('wsSave').textContent = canEdit ? '저장된 상태' : '읽기 전용';
      clearInterval(wsTimer);
      wsTimer = setInterval(() => {
        const ed = window.WikiEditor && WikiEditor.getEditor();
        if (!ed) return;
        const text = ed.getText().trim();
        const words = text ? text.split(/\s+/).length : 0;
        const chars = text.replace(/\s+/g, '').length;
        document.getElementById('wsWords').textContent = `단어 ${words}`;
        document.getElementById('wsChars').textContent = `글자 ${chars}`;
        document.getElementById('wsRead').textContent  = `읽기 약 ${Math.max(1, Math.round(words / 200))}분`;
      }, 2000);
    }
    function setSaveState(label) {
      const el = document.getElementById('syncStatus');
      if (el) el.textContent = label;
      const ws = document.getElementById('wsSave');
      if (ws) ws.textContent = label;
    }
    // 자동저장 없음 — 변경이 생기면 "저장 안 된 변경사항 있음"만 표시하고,
    // 실제 반영은 저장 버튼(WikiEditor.save)을 눌러야만 일어난다.
    window.addEventListener('wiki:dirty', () => setSaveState('저장 안 된 변경사항 있음'));
    window.addEventListener('wiki:saved', () => setSaveState('저장됨 · ' + new Date().toLocaleTimeString()));

    // 저장하지 않은 변경사항이 있으면 페이지를 떠나기 전에 확인창을 띄운다.
    window.addEventListener('beforeunload', (e) => {
      if (window.WikiEditor && WikiEditor.isDirty && WikiEditor.isDirty()) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    let historyOpen = false;
    async function toggleHistory() {
      const hc = document.getElementById('historyCard');
      historyOpen = !historyOpen;
      hc.style.display = historyOpen ? 'block' : 'none';
      if (!historyOpen) return;
      const el = document.getElementById('historyList');
      el.innerHTML = '<p class="muted" style="font-size:14px;">불러오는 중...</p>';
      try {
        const list = await api('/api/wiki/' + encodeURIComponent(slug) + '/history', { auth: false });
        const maxVer = list.length ? Math.max(...list.map(h => h.version)) : 0;
        el.innerHTML = list.map(h => `
          <div class="history-row">
            <span class="hr-ver">v${h.version}</span>
            <div class="hr-main">
              <div class="hr-summary">${escapeHtml(h.summary || '(요약 없음)')}</div>
              <div class="hr-sub">${escapeHtml(h.author)} · ${(h.created_at||'').replace('T',' ').slice(0,16)}</div>
            </div>
            ${(Auth.isLoggedIn && h.version !== maxVer)
              ? `<button class="btn btn-ghost" data-rev="${h.id}" data-ver="${h.version}" style="padding:5px 12px;">이 버전으로</button>`
              : (h.version === maxVer ? '<span class="badge">현재</span>' : '')}
          </div>`).join('');
        el.querySelectorAll('button[data-rev]').forEach(b => {
          b.onclick = async () => {
            if (!confirm(`v${b.dataset.ver} 내용으로 되돌릴까요? (새 버전으로 기록돼요)`)) return;
            try {
              await api(`/api/wiki/${encodeURIComponent(slug)}/rollback/${b.dataset.rev}`, { method: 'POST' });
              historyOpen = false;
              await loadDoc();
              showAlert(alertEl, `v${b.dataset.ver} 내용으로 롤백됐어요.`, 'success');
            } catch (err) { showAlert(alertEl, err.message); }
          };
        });
      } catch (err) { el.innerHTML = `<p class="muted" style="font-size:14px;">${escapeHtml(err.message)}</p>`; }
    }

    /* ── 라우팅 ── */
    const newTitle = queryParam('new');
    if (slug) initDetail();
    else if (newTitle) initDraft(newTitle);
    else initHome();
  </script>
</body>
</html>
