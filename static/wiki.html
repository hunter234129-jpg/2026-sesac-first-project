<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위키 · 스터디 플랫폼</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand"><span class="dot">●</span> StudyBoard</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="container" style="max-width:820px;">
    <div class="alert" id="alert"></div>

    <!-- ════ 홈 뷰 ════ -->
    <div id="homeView" style="display:none;">
      <div class="dash-header"><h1>위키</h1><p>함께 만들어가는 학습 자료</p></div>

      <div class="wiki-search">
        <input type="search" id="searchInput" placeholder="주제 검색... (없으면 새로 만들 수 있어요)">
        <button class="btn btn-primary" id="searchBtn">검색</button>
      </div>

      <div id="searchResult"></div>

      <div class="card section">
        <div class="section-head">
          <h2>조회수 랭킹</h2>
          <div class="seg" id="periodSeg">
            <button data-p="today" class="active">오늘</button>
            <button data-p="week">주간</button>
          </div>
        </div>
        <div id="rankList"><p class="muted" style="font-size:14px;">불러오는 중...</p></div>
      </div>

      <div class="card section">
        <div class="section-head"><h2>최근 생성</h2></div>
        <div id="recentList"><p class="muted" style="font-size:14px;">불러오는 중...</p></div>
      </div>
    </div>

    <!-- ════ 상세 뷰 ════ -->
    <div id="detailView" style="display:none;">
      <a href="/wiki" class="muted" style="font-size:14px;">← 위키 홈</a>
      <div class="wiki-doc card mt-16" id="docCard">
        <p class="muted text-center" style="padding:40px 0;">불러오는 중...</p>
      </div>
      <!-- 편집 영역 -->
      <div class="card mt-16" id="editCard" style="display:none;">
        <div class="section-head">
          <h2 id="editTitle">편집</h2>
          <button class="btn btn-ghost" id="aiDraftBtn" style="padding:7px 14px;">🛰️ AI 초안 생성</button>
        </div>
        <div class="field">
          <textarea id="editContent" rows="16" style="resize:vertical;" placeholder="내용을 입력하세요 (자유 형식)"></textarea>
        </div>
        <div class="field">
          <label for="editSummary">변경 요약</label>
          <input type="text" id="editSummary" placeholder="예: 오타 수정, 예제 추가" maxlength="200">
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" id="saveEditBtn">저장</button>
          <button class="btn btn-ghost" id="cancelEditBtn">취소</button>
        </div>
      </div>
      <!-- 이력 영역 -->
      <div class="card section mt-16" id="historyCard" style="display:none;">
        <div class="section-head"><h2>수정 이력</h2></div>
        <div id="historyList"><p class="muted" style="font-size:14px;">불러오는 중...</p></div>
      </div>

      <!-- 낙서(드로잉) 영역 -->
      <div class="card section mt-16" id="drawCard" style="display:none;">
        <div class="section-head"><h2>🎨 낙서</h2></div>
        <div class="draw-toolbar">
          <input type="color" id="drawColor" value="#1f6feb" title="색상">
          <input type="range" id="drawSize" min="1" max="40" value="4" title="굵기">
          <button class="btn btn-ghost" id="eraserBtn" style="padding:6px 12px;">지우개</button>
          <button class="btn btn-ghost" id="clearBtn" style="padding:6px 12px;">전체 지우기</button>
          <button class="btn btn-primary" id="saveDrawBtn" style="padding:6px 14px; margin-left:auto;">저장</button>
        </div>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    renderNav();
    const alertEl = document.getElementById('alert');
    const slug    = queryParam('slug');

    /* ══════════ 홈 뷰 ══════════ */
    function initHome() {
      document.getElementById('homeView').style.display = 'block';

      // 검색
      const searchInput = document.getElementById('searchInput');
      async function doSearch() {
        const q = searchInput.value.trim();
        const box = document.getElementById('searchResult');
        if (!q) { box.innerHTML = ''; return; }
        try {
          const d = await api('/api/wiki/search?q=' + encodeURIComponent(q), { auth: false });
          const results = d.results || [];
          let html = '<div class="card section">';
          if (results.length) {
            html += results.map(w => `
              <div class="wiki-rank-row">
                <a class="wr-title" href="/wiki?slug=${encodeURIComponent(w.slug)}">${escapeHtml(w.title)}</a>
                <span class="wr-views">조회 ${w.view_count}</span>
              </div>`).join('');
          } else {
            html += '<p class="muted" style="font-size:14px;">검색 결과가 없어요.</p>';
          }
          if (d.can_create) {
            html += `<div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
              <span class="muted" style="font-size:14px;">'<b style="color:var(--text)">${escapeHtml(q)}</b>' 주제가 없어요.</span>
              <button class="btn btn-success" id="createFromSearch" style="padding:8px 16px;">이 주제로 만들기</button>
            </div>`;
          }
          html += '</div>';
          box.innerHTML = html;
          const cfs = document.getElementById('createFromSearch');
          if (cfs) cfs.onclick = () => openCreate(q);
        } catch (err) { showAlert(alertEl, err.message); }
      }
      document.getElementById('searchBtn').onclick = doSearch;
      searchInput.onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };

      // 랭킹
      async function loadRanking(period) {
        const el = document.getElementById('rankList');
        try {
          const d = await api('/api/wiki?period=' + period + '&limit=10', { auth: false });
          const items = d.ranking || [];
          el.innerHTML = items.length ? items.map((w, i) => `
            <div class="wiki-rank-row">
              <span class="wr-num">${i + 1}</span>
              <a class="wr-title" href="/wiki?slug=${encodeURIComponent(w.slug)}">${escapeHtml(w.title)}</a>
              <span class="wr-views">전체 ${w.view_count} · ${period==='today'?'오늘':'주간'} ${w.period_views}</span>
            </div>`).join('')
            : '<p class="muted" style="font-size:14px;">아직 위키가 없어요.</p>';
        } catch (err) { el.innerHTML = `<p class="muted" style="font-size:14px;">${escapeHtml(err.message)}</p>`; }
      }
      document.getElementById('periodSeg').onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        document.querySelectorAll('#periodSeg button').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); loadRanking(b.dataset.p);
      };
      loadRanking('today');

      // 최근
      (async () => {
        const el = document.getElementById('recentList');
        try {
          const d = await api('/api/wiki?period=today', { auth: false });
          const items = d.recent || [];
          el.innerHTML = items.length ? items.map(w => `
            <div class="wiki-recent-row">
              <a class="wr-title" href="/wiki?slug=${encodeURIComponent(w.slug)}" style="flex:1;">${escapeHtml(w.title)}</a>
              <span class="wr-views" style="color:var(--muted); font-size:13px;">${(w.created_at||'').slice(0,10)}</span>
            </div>`).join('')
            : '<p class="muted" style="font-size:14px;">아직 위키가 없어요.</p>';
        } catch (_) {}
      })();
    }

    function openCreate(prefillTitle) {
      if (!Auth.isLoggedIn) { location.href = '/login?next=/wiki'; return; }
      const title = prompt('새 위키 제목', prefillTitle || '');
      if (title === null) return;
      const t = title.trim();
      if (!t) return;
      api('/api/wiki', { method: 'POST', body: { title: t, content: '', summary: '최초 생성' } })
        .then(d => { location.href = '/wiki?slug=' + encodeURIComponent(d.slug); })
        .catch(err => showAlert(alertEl, err.message));
    }

    /* ══════════ 상세 뷰 ══════════ */
    let curDoc = null;
    function initDetail() {
      document.getElementById('detailView').style.display = 'block';
      loadDoc();
    }

    async function loadDoc() {
      const card = document.getElementById('docCard');
      // 편집/이력 닫기
      document.getElementById('editCard').style.display = 'none';
      document.getElementById('historyCard').style.display = 'none';
      try {
        const w = await api('/api/wiki/' + encodeURIComponent(slug), { auth: false });
        curDoc = w;
        const canEdit = Auth.isLoggedIn;
        const isAdmin = Auth.isAdmin;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
            <div class="wd-title">${escapeHtml(w.title)}</div>
            <div class="wd-actions">
              <button class="btn btn-ghost" id="historyBtn" style="padding:7px 14px;">이력</button>
              <button class="btn btn-ghost" id="drawBtn" style="padding:7px 14px;">🎨 낙서</button>
              ${canEdit ? `<button class="btn btn-primary" id="editBtn" style="padding:7px 14px;">편집</button>` : ''}
              ${isAdmin ? `<button class="btn btn-danger" id="delBtn" style="padding:7px 14px;">삭제</button>` : ''}
            </div>
          </div>
          <div class="wd-meta">
            <span class="version-badge">v${w.version}</span>
            <span>✍️ 최초: ${escapeHtml(w.created_by)}</span>
            <span>🔧 최종: ${escapeHtml(w.last_editor)}</span>
            <span>👁 조회 ${w.view_count}</span>
            <span>🕒 ${(w.last_updated||'').replace('T',' ').slice(0,16)}</span>
          </div>
          <div class="wiki-content">${w.content ? escapeHtml(w.content) : '<span class="muted">아직 내용이 없어요. 편집을 눌러 첫 내용을 작성해보세요.</span>'}</div>`;

        const eb = document.getElementById('editBtn');
        if (eb) eb.onclick = openEdit;
        document.getElementById('historyBtn').onclick = toggleHistory;
        document.getElementById('drawBtn').onclick = toggleDraw;
        const db = document.getElementById('delBtn');
        if (db) db.onclick = async () => {
          if (!confirm('이 위키를 삭제할까요? (되돌릴 수 없어요)')) return;
          try { await api('/api/wiki/' + encodeURIComponent(slug), { method: 'DELETE' }); location.href = '/wiki'; }
          catch (err) { showAlert(alertEl, err.message); }
        };
      } catch (err) {
        card.innerHTML = `<p class="muted text-center" style="padding:40px 0;">${escapeHtml(err.message)}</p>`;
      }
    }

    function openEdit() {
      const ec = document.getElementById('editCard');
      ec.style.display = 'block';
      document.getElementById('editContent').value = curDoc.content || '';
      document.getElementById('editSummary').value = '';
      ec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    document.getElementById('cancelEditBtn').onclick = () => {
      document.getElementById('editCard').style.display = 'none';
    };
    document.getElementById('saveEditBtn').onclick = async () => {
      const btn = document.getElementById('saveEditBtn');
      setLoading(btn, true);
      try {
        await api('/api/wiki/' + encodeURIComponent(slug), { method: 'PUT', body: {
          content: document.getElementById('editContent').value,
          summary: document.getElementById('editSummary').value.trim() || '내용 수정',
        }});
        await loadDoc();
        showAlert(alertEl, '저장됐어요.', 'success');
      } catch (err) { showAlert(alertEl, err.message); }
      finally { setLoading(btn, false, '저장'); }
    };

    let historyOpen = false;
    async function toggleHistory() {
      const hc = document.getElementById('historyCard');
      historyOpen = !historyOpen;
      hc.style.display = historyOpen ? 'block' : 'none';
      if (!historyOpen) return;
      const el = document.getElementById('historyList');
      el.innerHTML = '<p class="muted" style="font-size:14px;">불러오는 중...</p>';
      try {
        const list = await api('/api/wiki/' + encodeURIComponent(slug) + '/history', { auth: false });
        const maxVer = list.length ? Math.max(...list.map(h => h.version)) : 0;
        el.innerHTML = list.map(h => `
          <div class="history-row">
            <span class="hr-ver">v${h.version}</span>
            <div class="hr-main">
              <div class="hr-summary">${escapeHtml(h.summary || '(요약 없음)')}</div>
              <div class="hr-sub">${escapeHtml(h.author)} · ${(h.created_at||'').replace('T',' ').slice(0,16)}</div>
            </div>
            ${(Auth.isLoggedIn && h.version !== maxVer)
              ? `<button class="btn btn-ghost" data-rev="${h.id}" data-ver="${h.version}" style="padding:5px 12px;">이 버전으로</button>`
              : (h.version === maxVer ? '<span class="badge">현재</span>' : '')}
          </div>`).join('');
        el.querySelectorAll('button[data-rev]').forEach(b => {
          b.onclick = async () => {
            if (!confirm(`v${b.dataset.ver} 내용으로 되돌릴까요? (새 버전으로 기록돼요)`)) return;
            try {
              await api(`/api/wiki/${encodeURIComponent(slug)}/rollback/${b.dataset.rev}`, { method: 'POST' });
              historyOpen = false;
              await loadDoc();
              showAlert(alertEl, `v${b.dataset.ver} 내용으로 롤백됐어요.`, 'success');
            } catch (err) { showAlert(alertEl, err.message); }
          };
        });
      } catch (err) { el.innerHTML = `<p class="muted" style="font-size:14px;">${escapeHtml(err.message)}</p>`; }
    }

    /* ── AI 초안 생성 ── */
    document.getElementById('aiDraftBtn').onclick = async () => {
      const btn = document.getElementById('aiDraftBtn');
      const title = curDoc ? curDoc.title : (slug || '');
      if (!confirm('AI가 생성한 초안으로 편집창을 채울까요? (기존 입력은 덮어써져요)')) return;
      setLoading(btn, true);
      try {
        const d = await api('/api/ai/wiki-draft', { method: 'POST', body: { title } });
        document.getElementById('editContent').value = d.draft;
        showAlert(alertEl, 'AI 초안을 채웠어요. 검토 후 저장하세요.', 'success');
      } catch (err) { showAlert(alertEl, err.message); }
      finally { setLoading(btn, false, '🛰️ AI 초안 생성'); }
    };

    /* ── 낙서 캔버스 ── */
    let drawOpen = false, drawInit = false, drawing = false, erasing = false;
    function toggleDraw() {
      const card = document.getElementById('drawCard');
      drawOpen = !drawOpen;
      card.style.display = drawOpen ? 'block' : 'none';
      if (drawOpen) { setupDraw(); loadDrawing(); card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
    function setupDraw() {
      if (drawInit) return; drawInit = true;
      const cv = document.getElementById('drawCanvas');
      const ctx = cv.getContext('2d');
      cv.width = cv.getBoundingClientRect().width; cv.height = 360;
      ctx.fillStyle = '#fbfcff'; ctx.fillRect(0, 0, cv.width, cv.height);
      cv._ctx = ctx;
      const pos = (e) => { const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
      const start = (e) => { e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
      const move = (e) => {
        if (!drawing) return; e.preventDefault(); const p = pos(e);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = erasing ? '#fbfcff' : document.getElementById('drawColor').value;
        ctx.lineWidth = erasing ? 24 : +document.getElementById('drawSize').value;
        ctx.lineTo(p.x, p.y); ctx.stroke();
      };
      const end = () => { drawing = false; };
      cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
      cv.addEventListener('touchstart', start, { passive: false }); cv.addEventListener('touchmove', move, { passive: false }); cv.addEventListener('touchend', end);
      document.getElementById('eraserBtn').onclick = (e) => { erasing = !erasing; e.target.classList.toggle('btn-primary', erasing); };
      document.getElementById('clearBtn').onclick = () => { ctx.fillStyle = '#fbfcff'; ctx.fillRect(0, 0, cv.width, cv.height); };
      document.getElementById('saveDrawBtn').onclick = async () => {
        const btn = document.getElementById('saveDrawBtn'); setLoading(btn, true);
        try { await api('/api/wiki/' + encodeURIComponent(slug) + '/drawing', { method: 'PUT', body: { drawing: cv.toDataURL('image/png') } }); showAlert(alertEl, '낙서를 저장했어요.', 'success'); }
        catch (err) { showAlert(alertEl, err.message); }
        finally { setLoading(btn, false, '저장'); }
      };
    }
    async function loadDrawing() {
      try {
        const d = await api('/api/wiki/' + encodeURIComponent(slug) + '/drawing', { auth: false });
        if (d.drawing) {
          const cv = document.getElementById('drawCanvas'); const ctx = cv._ctx;
          const img = new Image();
          img.onload = () => { ctx.fillStyle = '#fbfcff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height); };
          img.src = d.drawing;
        }
      } catch (_) {}
    }

    /* ── 라우팅 ── */
    if (slug) initDetail(); else initHome();
  </script>
</body>
</html>
