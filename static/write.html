<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글쓰기 · 스터디 플랫폼</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .deadline-wrap { position: relative; display: flex; align-items: center; }
    .deadline-wrap input[type="date"] { width: 100%; padding-right: 38px; }
    .cal-icon-btn {
      position: absolute; right: 8px; background: none; border: none;
      cursor: pointer; font-size: 16px; padding: 0; line-height: 1;
      color: var(--muted); opacity: 0.75; transition: opacity .15s;
    }
    .cal-icon-btn:hover { opacity: 1; }
    .cal-popup-wrap {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      z-index: 400; user-select: none;
    }
    .cal-popup {
      background: #1e2240; border: 1px solid rgba(120,140,200,.35);
      border-radius: 14px; padding: 14px; box-shadow: 0 10px 36px rgba(0,0,0,.5);
      min-width: 252px;
    }
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .cal-nav-btn {
      background: none; border: none; color: #9ba3c0; cursor: pointer;
      font-size: 20px; padding: 2px 10px; border-radius: 7px; line-height: 1;
    }
    .cal-nav-btn:hover { background: rgba(255,255,255,.1); color: #e0e4f4; }
    .cal-title { font-size: 14px; font-weight: 700; color: #e0e4f4; }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center;
    }
    .cal-dow { font-size: 11px; color: #6b7494; padding: 4px 0 6px; }
    .cal-dow.sun { color: #e0455a; }
    .cal-dow.sat { color: #5b9bff; }
    .cal-day {
      background: none; border: none; color: #c8cde8; cursor: pointer;
      font-size: 13px; padding: 7px 2px; border-radius: 7px; line-height: 1;
    }
    .cal-day:hover { background: rgba(120,140,200,.22); }
    .cal-day.sun { color: #e0455a; }
    .cal-day.sat { color: #5b9bff; }
    .cal-day.today { border: 1px solid rgba(110,168,255,.5); }
    .cal-day.selected { background: linear-gradient(130deg,#6ea8ff,#3f7de0); color:#fff; font-weight:700; }
    .cal-day:disabled { opacity: .3; cursor: default; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard" class="brand"><span class="dot">●</span> StudyBoard</a>
    <span class="breadcrumb" id="breadcrumb"></span>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="app-shell">
  <aside class="app-rail" id="appRail"></aside>
  <div class="app-content">
  <div class="container" style="max-width:760px;">
    <div class="dash-header"><h1 id="pageTitle">글쓰기</h1></div>

    <div class="alert" id="alert"></div>

    <form class="card" id="writeForm">
      <div class="field" id="typeField">
        <label>유형</label>
        <div class="seg" id="typeSeg">
          <button type="button" data-type="post" class="active">일반 게시글</button>
          <button type="button" data-type="study">스터디 모집</button>
        </div>
      </div>

      <div class="field">
        <label for="title">제목 *</label>
        <input type="text" id="title" placeholder="제목을 입력하세요" required>
      </div>

      <div class="field">
        <label for="category">카테고리</label>
        <input type="text" id="category" placeholder="예: 자격증, 어학, 코딩 (선택)">
      </div>

      <!-- 스터디 전용 필드 -->
      <div id="studyFields" class="hidden">
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <div class="field" style="flex:1; min-width:140px;">
            <label for="recruitCount">모집 인원</label>
            <input type="number" id="recruitCount" min="0" placeholder="0" value="0">
          </div>
          <div class="field" style="flex:1; min-width:140px;">
            <label for="recruitDeadline">모집 마감일</label>
            <div class="deadline-wrap">
              <input type="date" id="recruitDeadline">
              <button type="button" class="cal-icon-btn" id="deadlineCalBtn" title="날짜 선택">📅</button>
              <div class="cal-popup-wrap" id="deadlineCalPopup">
                <div class="cal-popup" id="deadlineCalInner"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="field">분야</label>
          <input type="text" id="field" placeholder="예: 정보처리기사 실기 (선택)">
        </div>
      </div>

      <div class="field">
        <label for="content">내용</label>
        <textarea id="content" rows="12" placeholder="내용을 입력하세요" style="resize:vertical;"></textarea>
      </div>

      <div style="display:flex; gap:8px;">
        <button type="submit" class="btn btn-primary" id="submitBtn">등록</button>
        <a class="btn btn-ghost" id="cancelBtn" href="/board">취소</a>
      </div>
    </form>
  </div>
  </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    if (!Auth.require()) { throw new Error('redirect'); }
    renderNav();
    renderRail('board');

    const editId  = queryParam('id');           // 있으면 수정 모드
    renderBreadcrumb([{ label: '게시판', href: '/board' }, { label: editId ? '글 수정' : '글쓰기' }]);
    const isEdit  = !!editId;
    const alertEl = document.getElementById('alert');
    let curType   = 'post';

    const typeSeg     = document.getElementById('typeSeg');
    const studyFields = document.getElementById('studyFields');

    function setType(t) {
      curType = t;
      document.querySelectorAll('#typeSeg button').forEach(b =>
        b.classList.toggle('active', b.dataset.type === t));
      studyFields.classList.toggle('hidden', t !== 'study');
    }
    typeSeg.onclick = (e) => {
      const btn = e.target.closest('button');
      if (btn) setType(btn.dataset.type);
    };

    // 수정 모드: 기존 값 로드 + 유형 변경 잠금
    if (isEdit) {
      document.getElementById('pageTitle').textContent = '글 수정';
      document.getElementById('submitBtn').textContent = '수정';
      document.getElementById('cancelBtn').href = '/post?id=' + editId;
      document.getElementById('typeField').classList.add('hidden'); // 유형은 변경 불가
      (async () => {
        try {
          const p = await api('/api/posts/' + editId, { auth: false });
          if (p.user_id !== Auth.userId) {
            showAlert(alertEl, '본인 글만 수정할 수 있어요.');
            document.getElementById('submitBtn').disabled = true;
            return;
          }
          setType(p.type);
          document.getElementById('title').value    = p.title || '';
          document.getElementById('category').value = p.category || '';
          document.getElementById('content').value  = p.content || '';
          if (p.type === 'study') {
            document.getElementById('recruitCount').value = p.recruit_count ?? 0;
            if (p.recruit_deadline) {
              const raw = String(p.recruit_deadline);
              if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
                document.getElementById('recruitDeadline').value = raw.slice(0, 10);
              } else {
                const d = new Date(raw);
                if (!isNaN(d)) {
                  const y = d.getUTCFullYear();
                  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
                  const day = String(d.getUTCDate()).padStart(2, '0');
                  document.getElementById('recruitDeadline').value = `${y}-${m}-${day}`;
                }
              }
            }
            document.getElementById('field').value = p.field || '';
          }
        } catch (err) { showAlert(alertEl, err.message); }
      })();
    }

    document.getElementById('writeForm').onsubmit = async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const btn = document.getElementById('submitBtn');
      const title = document.getElementById('title').value.trim();
      if (!title) { showAlert(alertEl, '제목을 입력해주세요.'); return; }
      setLoading(btn, true);

      try {
        if (isEdit) {
          const editBody = {
            title,
            content:  document.getElementById('content').value,
            category: document.getElementById('category').value.trim(),
          };
          if (curType === 'study') {
            editBody.recruit_count    = +document.getElementById('recruitCount').value || 0;
            editBody.recruit_deadline = document.getElementById('recruitDeadline').value || null;
            editBody.field            = document.getElementById('field').value.trim();
          }
          await api('/api/posts/' + editId, { method: 'PUT', body: editBody });
          location.href = '/post?id=' + editId;
        } else {
          const body = {
            type: curType,
            title,
            content:  document.getElementById('content').value,
            category: document.getElementById('category').value.trim(),
          };
          if (curType === 'study') {
            body.recruit_count    = +document.getElementById('recruitCount').value || 0;
            body.recruit_deadline = document.getElementById('recruitDeadline').value || null;
            body.field            = document.getElementById('field').value.trim();
          }
          const d = await api('/api/posts', { method: 'POST', body });
          location.href = '/post?id=' + d.id;
        }
      } catch (err) {
        showAlert(alertEl, err.message);
        setLoading(btn, false, isEdit ? '수정' : '등록');
      }
    };
  </script>

  <script>
    /* ── 모집 마감일 커스텀 달력 ── */
    (function () {
      const dateInput = document.getElementById('recruitDeadline');
      const calBtn    = document.getElementById('deadlineCalBtn');
      const popupWrap = document.getElementById('deadlineCalPopup');
      const calInner  = document.getElementById('deadlineCalInner');

      const KO_DOW   = ['일', '월', '화', '수', '목', '금', '토'];
      const KO_MON   = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

      let calYear = 0, calMonth = 0;

      function getSelected() {
        if (!dateInput.value) return null;
        const [y, m, d] = dateInput.value.split('-').map(Number);
        return { y, m: m - 1, d };
      }

      function render() {
        const today = new Date();
        const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();
        const sel = getSelected();

        const firstDow = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

        let html = `
          <div class="cal-nav">
            <button type="button" class="cal-nav-btn" id="calPrev">‹</button>
            <span class="cal-title">${calYear}년 ${KO_MON[calMonth]}</span>
            <button type="button" class="cal-nav-btn" id="calNext">›</button>
          </div>
          <div class="cal-grid">
            ${KO_DOW.map((d, i) => `<span class="cal-dow${i===0?' sun':i===6?' sat':''}">${d}</span>`).join('')}
        `;

        for (let i = 0; i < firstDow; i++) html += `<span></span>`;

        for (let d = 1; d <= daysInMonth; d++) {
          const dow = (firstDow + d - 1) % 7;
          const isToday = calYear === todayY && calMonth === todayM && d === todayD;
          const isSel   = sel && calYear === sel.y && calMonth === sel.m && d === sel.d;
          let cls = 'cal-day';
          if (dow === 0) cls += ' sun';
          if (dow === 6) cls += ' sat';
          if (isToday)   cls += ' today';
          if (isSel)     cls += ' selected';
          html += `<button type="button" class="${cls}" data-d="${d}">${d}</button>`;
        }

        html += `</div>`;
        calInner.innerHTML = html;

        calInner.querySelector('#calPrev').onclick = (e) => {
          e.stopPropagation();
          if (--calMonth < 0) { calMonth = 11; calYear--; }
          render();
        };
        calInner.querySelector('#calNext').onclick = (e) => {
          e.stopPropagation();
          if (++calMonth > 11) { calMonth = 0; calYear++; }
          render();
        };
        calInner.querySelectorAll('.cal-day').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const mm = String(calMonth + 1).padStart(2, '0');
            const dd = String(+btn.dataset.d).padStart(2, '0');
            dateInput.value = `${calYear}-${mm}-${dd}`;
            close();
          };
        });
      }

      function open() {
        const sel = getSelected();
        if (sel) { calYear = sel.y; calMonth = sel.m; }
        else { const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); }
        render();
        popupWrap.style.display = 'block';
      }

      function close() { popupWrap.style.display = 'none'; }

      calBtn.onclick = (e) => {
        e.stopPropagation();
        popupWrap.style.display === 'block' ? close() : open();
      };

      document.addEventListener('click', (e) => {
        if (!popupWrap.contains(e.target) && e.target !== calBtn) close();
      });
    })();
  </script>
</body>
</html>
