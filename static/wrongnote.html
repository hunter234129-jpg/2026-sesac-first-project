<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오답노트 · 스터디 플랫폼</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand"><span class="dot">●</span> StudyBoard</a>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <div class="app-shell">
  <aside class="app-rail" id="appRail"></aside>
  <div class="app-content">
  <div class="container">
    <div class="dash-header">
      <h1>❌ 오답노트</h1>
      <p>문제풀기에서 틀린 문제가 자동으로 모여요. 필요 없으면 지워도 돼요.</p>
    </div>

    <div id="wnBody">
      <p class="muted text-center" style="padding:40px 0;">불러오는 중...</p>
    </div>
  </div>
  </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    if (!Auth.require()) { /* 로그인 페이지로 이동됨 */ }
    renderNav();
    renderRail('quiz');

    const wnBody = document.getElementById('wnBody');
    let allNotes = [];

    function render() {
      if (!allNotes.length) {
        wnBody.innerHTML = `
          <div class="card text-center" style="padding:50px 20px;">
            <div style="font-size:36px; margin-bottom:10px;">🎉</div>
            <p class="muted">오답노트가 비어 있어요! 지금까지 완벽해요.</p>
          </div>`;
        return;
      }

      wnBody.innerHTML = allNotes.map(n => `
        <div class="card wn-item" data-id="${n.id}">
          <div class="wn-head">
            <span class="weak-subject-badge">${escapeHtml(n.subject_query)}</span>
            <span class="wn-count">틀린 지 ${new Date(n.created_at).toLocaleDateString('ko-KR')}</span>
          </div>
          <div class="quiz-q">${escapeHtml(n.question)}</div>
          <div class="quiz-choices">
            ${n.choices.map((c, i) => `
              <button class="quiz-choice ${i === n.chosen_index ? 'chosen-wrong' : ''} ${i === n.answer_index ? 'reveal-correct' : ''}" disabled>
                ${i === n.chosen_index ? '❌ ' : ''}${i === n.answer_index ? '✅ ' : ''}${escapeHtml(c)}
              </button>`).join('')}
          </div>
          <div class="quiz-result"><div class="qr-text">${escapeHtml(n.explanation || '')}</div></div>
          <div class="wn-actions">
            <button class="btn btn-ghost wn-delete" data-id="${n.id}">삭제</button>
            <a class="btn btn-ghost" href="/roadmap?subject=${encodeURIComponent(n.subject_query)}">↻ 같은 주제로 다시 풀기</a>
          </div>
        </div>`).join('');

      wnBody.querySelectorAll('.wn-delete').forEach(btn => {
        btn.onclick = async () => {
          btn.disabled = true;
          try {
            await api(`/api/wrongnotes/${btn.dataset.id}`, { method: 'DELETE' });
            allNotes = allNotes.filter(n => String(n.id) !== btn.dataset.id);
            render();
          } catch (e) {
            alert(e.message);
            btn.disabled = false;
          }
        };
      });
    }

    (async () => {
      try {
        allNotes = await api('/api/wrongnotes');
        render();
      } catch (e) {
        wnBody.innerHTML = `<p class="muted text-center" style="padding:40px 0;">불러오지 못했어요: ${escapeHtml(e.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
